# PayMongo Test Mode Configuration
paymongo:
  enabled: true
  # Secret key for API calls (sk_test_*)
  secret-key: ${PAYMONGO_SECRET_KEY:}
  # Public key for frontend (pk_test_*)
  public-key: pk_test_ZCjsmVJe6g7osMYcKfZtTrY6
  base-url: https://api.paymongo.com/v1
  # From PayMongo Dashboard > Developers > Webhooks > (your endpoint) > Signing secret.
  # Required to verify that /api/webhooks/paymongo POSTs actually came from
  # PayMongo -- until this is set, webhook signatures are NOT verified
  # (a loud warning is logged on every delivery as a reminder).
  webhook-secret: ""

# Application frontend URL for PayMongo redirects
app:
  frontend-url: http://localhost:5173

# Judge0 for programming assessments
judge0:
  enabled: true
  base-url: https://ce.judge0.com
  cpu-time-limit-seconds: 5
  memory-limit-kb: 128000

# Spring security config
spring:
  security:
    oauth2:
      resourceserver:
        jwt:
          issuer-uri: ${COGNITO_ISSUER_URI}
