services:
  # --- Infrastructure ---------------------------------------------------

  postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_DB: rebyu
      POSTGRES_USER: rebyu
      POSTGRES_PASSWORD: rebyu
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U rebyu -d rebyu"]
      interval: 5s
      timeout: 5s
      retries: 20
    networks:
      - rebyu-net

  qdrant:
    image: qdrant/qdrant:latest
    ports:
      - "6333:6333"
      - "6334:6334"
    volumes:
      - qdrant_data:/qdrant/storage
    networks:
      - rebyu-net

  rabbitmq:
    image: rabbitmq:3-management-alpine
    ports:
      - "5672:5672"
      - "15672:15672"
    volumes:
      - rabbitmq_data:/var/lib/rabbitmq
    healthcheck:
      test: ["CMD", "rabbitmq-diagnostics", "-q", "ping"]
      interval: 10s
      timeout: 5s
      retries: 20
    networks:
      - rebyu-net

  # Celery broker/result-backend for the Python service (RabbitMQ above is
  # the cross-service event bus with backend-java, a separate concern).
  redis:
    image: redis:7-alpine
    ports:
      - "6379:6379"
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 5s
      retries: 20
    networks:
      - rebyu-net

  # --- Application services ----------------------------------------------

  backend:
    build:
      context: backend-java
      dockerfile: Dockerfile
    ports:
      - "8080:8080"
    env_file:
      - backend-java/.env
    environment:
      DB_URL: jdbc:postgresql://postgres:5432/rebyu
      DB_HOST: postgres
      DB_PORT: 5432
      DB_DATABASE: rebyu
      DB_USERNAME: rebyu
      DB_PASSWORD: rebyu
      RABBITMQ_HOST: rabbitmq
      RABBITMQ_PORT: 5672
      RABBITMQ_USERNAME: guest
      RABBITMQ_PASSWORD: guest
      AI_SERVICE_URL: http://python-api:8000/api/v1/ai
      BKT_SERVICE_URL: http://python-api:8000/api/v1/bkt
    healthcheck:
      test: ["CMD", "wget", "--spider", "-q", "http://localhost:8080/api/user-types"]
      interval: 10s
      timeout: 5s
      retries: 20
      start_period: 100s
    depends_on:
      postgres:
        condition: service_healthy
      rabbitmq:
        condition: service_healthy
    networks:
      - rebyu-net
    develop:
      watch:
        - action: rebuild
          path: ./backend-java/src
        - action: rebuild
          path: ./backend-java/pom.xml

  python-api:
    build:
      context: python-backend
      dockerfile: Dockerfile
    command: >
      sh -c "alembic upgrade head &&
             uvicorn app.main:app --host 0.0.0.0 --port 8000"
    ports:
      - "8000:8000"
    env_file:
      - python-backend/.env
    environment:
      DATABASE_URL: postgresql+psycopg://rebyu:rebyu@postgres:5432/rebyu
      DB_SCHEMA: bkt
      REDIS_URL: redis://redis:6379/0
      CELERY_BROKER_URL: redis://redis:6379/0
      CELERY_RESULT_BACKEND: redis://redis:6379/1
      QDRANT_URL: http://qdrant:6333
      RABBITMQ_HOST: rabbitmq
      RABBITMQ_PORT: 5672
    volumes:
      - ./python-backend:/app
      - python_artifacts:/app/artifacts
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
      rabbitmq:
        condition: service_healthy
      qdrant:
        condition: service_started
    networks:
      - rebyu-net

  python-worker:
    build:
      context: python-backend
      dockerfile: Dockerfile
    command: celery -A app.workers.celery_app.celery_app worker --loglevel=INFO --concurrency=1
    env_file:
      - python-backend/.env
    environment:
      DATABASE_URL: postgresql+psycopg://rebyu:rebyu@postgres:5432/rebyu
      DB_SCHEMA: bkt
      REDIS_URL: redis://redis:6379/0
      CELERY_BROKER_URL: redis://redis:6379/0
      CELERY_RESULT_BACKEND: redis://redis:6379/1
      QDRANT_URL: http://qdrant:6333
      RABBITMQ_HOST: rabbitmq
      RABBITMQ_PORT: 5672
    volumes:
      - ./python-backend:/app
      - python_artifacts:/app/artifacts
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
      rabbitmq:
        condition: service_healthy
    networks:
      - rebyu-net
    develop:
      watch:
        - action: sync+restart
          path: ./python-backend
          target: /app

  python-beat:
    build:
      context: python-backend
      dockerfile: Dockerfile
    command: celery -A app.workers.celery_app.celery_app beat --loglevel=INFO
    env_file:
      - python-backend/.env
    environment:
      DATABASE_URL: postgresql+psycopg://rebyu:rebyu@postgres:5432/rebyu
      DB_SCHEMA: bkt
      REDIS_URL: redis://redis:6379/0
      CELERY_BROKER_URL: redis://redis:6379/0
      CELERY_RESULT_BACKEND: redis://redis:6379/1
      QDRANT_URL: http://qdrant:6333
      RABBITMQ_HOST: rabbitmq
      RABBITMQ_PORT: 5672
    volumes:
      - ./python-backend:/app
      - python_artifacts:/app/artifacts
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
      rabbitmq:
        condition: service_healthy
    networks:
      - rebyu-net
    develop:
      watch:
        - action: sync+restart
          path: ./python-backend
          target: /app

  # One-shot: loads db-backup-2026-08-24/*.copy reference data (achievements,
  # exam_types, user_types, etc.) once the backend has created the schema.
  # Safe to re-run -- skips any table that already has rows.
  db-seed:
    image: postgres:16-alpine
    entrypoint: ["sh", "/seed/seed.sh"]
    environment:
      DB_HOST: postgres
      DB_DATABASE: rebyu
      DB_USERNAME: rebyu
      DB_PASSWORD: rebyu
    volumes:
      - ./db-backup-2026-08-24:/seed:ro
    depends_on:
      backend:
        condition: service_healthy
    networks:
      - rebyu-net

  frontend:
    build:
      context: frontend
      dockerfile: Dockerfile
    ports:
      - "3000:80"
    depends_on:
      - backend
    networks:
      - rebyu-net
    develop:
      watch:
        - action: rebuild
          path: ./frontend/src
        - action: rebuild
          path: ./frontend/index.html
        - action: rebuild
          path: ./frontend/package.json

volumes:
  postgres_data:
  qdrant_data:
  rabbitmq_data:
  python_artifacts:

networks:
  rebyu-net:
    driver: bridge
