<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 406" width="900" height="406" font-family="system-ui, -apple-system, 'Segoe UI', Nunito, 'Helvetica Neue', Arial, sans-serif" role="img" aria-label="The IEEE 802 family"><defs><marker id="tip" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#afafaf"/></marker></defs><rect width="900" height="406" fill="#ffffff"/><text x="28" y="40" font-size="19" font-weight="800" fill="#4b4b4b" text-anchor="start">The IEEE 802 family</text><text x="28" y="62" font-size="13" font-weight="400" fill="#777777" text-anchor="start">802 splits the data link layer into LLC above and MAC below.</text><rect x="28" y="92" width="844" height="230" rx="12" fill="#ffffff" stroke="#e5e5e5" stroke-width="2"/><rect x="28" y="92" width="844" height="40" rx="12" fill="#f7f9fc"/><rect x="28" y="120" width="844" height="12" fill="#f7f9fc"/><text x="42" y="117" font-size="12.5" font-weight="800" fill="#4b4b4b" text-anchor="start">Standard</text><text x="193.92" y="117" font-size="12.5" font-weight="800" fill="#4b4b4b" text-anchor="start">Covers</text><text x="548.4" y="117" font-size="12.5" font-weight="800" fill="#4b4b4b" text-anchor="start">Where you meet it</text><line x1="28" y1="132" x2="872" y2="132" stroke="#e5e5e5" stroke-width="2"/><text x="42" y="156" font-size="12" font-weight="700" fill="#4b4b4b" text-anchor="start">802.1</text><text x="193.92" y="156" font-size="12" font-weight="400" fill="#777777" text-anchor="start">Bridging, VLANs, port security</text><text x="548.4" y="156" font-size="12" font-weight="400" fill="#777777" text-anchor="start">802.1Q tagging, 802.1X auth</text><rect x="28" y="170" width="844" height="38" fill="#f7f9fc"/><line x1="28" y1="170" x2="872" y2="170" stroke="#e5e5e5" stroke-width="2"/><text x="42" y="194" font-size="12" font-weight="700" fill="#4b4b4b" text-anchor="start">802.2</text><text x="193.92" y="194" font-size="12" font-weight="400" fill="#777777" text-anchor="start">Logical Link Control</text><text x="548.4" y="194" font-size="12" font-weight="400" fill="#777777" text-anchor="start">The LLC sublayer above MAC</text><line x1="28" y1="208" x2="872" y2="208" stroke="#e5e5e5" stroke-width="2"/><text x="42" y="232" font-size="12" font-weight="700" fill="#4b4b4b" text-anchor="start">802.3</text><text x="193.92" y="232" font-size="12" font-weight="400" fill="#777777" text-anchor="start">Ethernet</text><text x="548.4" y="232" font-size="12" font-weight="400" fill="#777777" text-anchor="start">Every wired LAN port</text><rect x="28" y="246" width="844" height="38" fill="#f7f9fc"/><line x1="28" y1="246" x2="872" y2="246" stroke="#e5e5e5" stroke-width="2"/><text x="42" y="270" font-size="12" font-weight="700" fill="#4b4b4b" text-anchor="start">802.11</text><text x="193.92" y="270" font-size="12" font-weight="400" fill="#777777" text-anchor="start">Wireless LAN</text><text x="548.4" y="270" font-size="12" font-weight="400" fill="#777777" text-anchor="start">Wi-Fi</text><line x1="28" y1="284" x2="872" y2="284" stroke="#e5e5e5" stroke-width="2"/><text x="42" y="308" font-size="12" font-weight="700" fill="#4b4b4b" text-anchor="start">802.15</text><text x="193.92" y="308" font-size="12" font-weight="400" fill="#777777" text-anchor="start">Wireless PAN</text><text x="548.4" y="308" font-size="12" font-weight="400" fill="#777777" text-anchor="start">Bluetooth, Zigbee</text><rect x="28" y="92" width="844" height="230" rx="12" fill="none" stroke="#e5e5e5" stroke-width="2"/><rect x="28" y="340" width="844" height="44" rx="12" fill="#f7f9fc" stroke="#e5e5e5" stroke-width="2"/><text x="450.0" y="367" font-size="12.5" font-weight="400" fill="#777777" text-anchor="middle">Only the MAC half changes between Ethernet and Wi-Fi; LLC lets the layers above stay identical.</text></svg>