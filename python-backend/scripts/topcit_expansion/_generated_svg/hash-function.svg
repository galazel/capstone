<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 268" width="900" height="268" font-family="system-ui, -apple-system, 'Segoe UI', Nunito, 'Helvetica Neue', Arial, sans-serif" role="img" aria-label="A hash function is one-way and fixed-length"><defs><marker id="tip" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#afafaf"/></marker></defs><rect width="900" height="268" fill="#ffffff"/><text x="28" y="40" font-size="19" font-weight="800" fill="#4b4b4b" text-anchor="start">A hash function is one-way and fixed-length</text><text x="28" y="62" font-size="13" font-weight="400" fill="#777777" text-anchor="start">Deterministic, fixed-length, and infeasible to reverse.</text><rect x="28.0" y="92" width="191.5" height="86" rx="12" fill="#ffffff" stroke="#e5e5e5" stroke-width="2"/><rect x="28.0" y="102" width="6" height="66" rx="3" fill="#1cb0f6"/><text x="123.75" y="132.5" font-size="14" font-weight="700" fill="#4b4b4b" text-anchor="middle">Input</text><text x="123.75" y="151.5" font-size="12" font-weight="400" fill="#777777" text-anchor="middle">any size at all</text><line x1="224.5" y1="135.0" x2="240.5" y2="135.0" stroke="#afafaf" stroke-width="2" marker-end="url(#tip)"/><rect x="245.5" y="92" width="191.5" height="86" rx="12" fill="#ffffff" stroke="#e5e5e5" stroke-width="2"/><rect x="245.5" y="102" width="6" height="66" rx="3" fill="#00b8d4"/><text x="341.25" y="132.5" font-size="14" font-weight="700" fill="#4b4b4b" text-anchor="middle">Hash function</text><text x="341.25" y="151.5" font-size="12" font-weight="400" fill="#777777" text-anchor="middle">SHA-256</text><line x1="442.0" y1="135.0" x2="458.0" y2="135.0" stroke="#afafaf" stroke-width="2" marker-end="url(#tip)"/><rect x="463.0" y="92" width="191.5" height="86" rx="12" fill="#ffffff" stroke="#e5e5e5" stroke-width="2"/><rect x="463.0" y="102" width="6" height="66" rx="3" fill="#1b6ef3"/><text x="558.75" y="132.5" font-size="14" font-weight="700" fill="#4b4b4b" text-anchor="middle">Digest</text><text x="558.75" y="151.5" font-size="12" font-weight="400" fill="#777777" text-anchor="middle">always 256 bits</text><line x1="659.5" y1="135.0" x2="675.5" y2="135.0" stroke="#afafaf" stroke-width="2" marker-end="url(#tip)"/><rect x="680.5" y="92" width="191.5" height="86" rx="12" fill="#ffffff" stroke="#e5e5e5" stroke-width="2"/><rect x="680.5" y="102" width="6" height="66" rx="3" fill="#ff9600"/><text x="776.25" y="132.5" font-size="14" font-weight="700" fill="#4b4b4b" text-anchor="middle">Compare</text><text x="776.25" y="151.5" font-size="12" font-weight="400" fill="#777777" text-anchor="middle">same input, same digest</text><rect x="28" y="198" width="844" height="46" rx="12" fill="#f7f9fc" stroke="#e5e5e5" stroke-width="2"/><text x="450.0" y="226" font-size="12.5" font-weight="400" fill="#777777" text-anchor="middle">Change one bit of the input and roughly half the output bits change - the avalanche effect, which is what makes tampering detectable.</text></svg>