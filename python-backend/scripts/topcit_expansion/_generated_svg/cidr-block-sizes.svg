<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 482" width="900" height="482" font-family="system-ui, -apple-system, 'Segoe UI', Nunito, 'Helvetica Neue', Arial, sans-serif" role="img" aria-label="The block size shortcut"><defs><marker id="tip" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#afafaf"/></marker></defs><rect width="900" height="482" fill="#ffffff"/><text x="28" y="40" font-size="19" font-weight="800" fill="#4b4b4b" text-anchor="start">The block size shortcut</text><text x="28" y="62" font-size="13" font-weight="400" fill="#777777" text-anchor="start">Block size is 256 minus the last non-zero mask octet; subnets start at multiples of it.</text><rect x="28" y="92" width="844" height="306" rx="12" fill="#ffffff" stroke="#e5e5e5" stroke-width="2"/><rect x="28" y="92" width="844" height="40" rx="12" fill="#f7f9fc"/><rect x="28" y="120" width="844" height="12" fill="#f7f9fc"/><text x="42" y="117" font-size="12.5" font-weight="800" fill="#4b4b4b" text-anchor="start">Prefix</text><text x="177.04" y="117" font-size="12.5" font-weight="800" fill="#4b4b4b" text-anchor="start">Mask</text><text x="464.0" y="117" font-size="12.5" font-weight="800" fill="#4b4b4b" text-anchor="start">Block size</text><text x="666.56" y="117" font-size="12.5" font-weight="800" fill="#4b4b4b" text-anchor="start">Usable hosts</text><line x1="28" y1="132" x2="872" y2="132" stroke="#e5e5e5" stroke-width="2"/><text x="42" y="156" font-size="12" font-weight="700" fill="#4b4b4b" text-anchor="start">/24</text><text x="177.04" y="156" font-size="12" font-weight="400" fill="#777777" text-anchor="start">255.255.255.0</text><text x="464.0" y="156" font-size="12" font-weight="400" fill="#777777" text-anchor="start">256</text><text x="666.56" y="156" font-size="12" font-weight="400" fill="#777777" text-anchor="start">254</text><rect x="28" y="170" width="844" height="38" fill="#f7f9fc"/><line x1="28" y1="170" x2="872" y2="170" stroke="#e5e5e5" stroke-width="2"/><text x="42" y="194" font-size="12" font-weight="700" fill="#4b4b4b" text-anchor="start">/25</text><text x="177.04" y="194" font-size="12" font-weight="400" fill="#777777" text-anchor="start">255.255.255.128</text><text x="464.0" y="194" font-size="12" font-weight="400" fill="#777777" text-anchor="start">128</text><text x="666.56" y="194" font-size="12" font-weight="400" fill="#777777" text-anchor="start">126</text><line x1="28" y1="208" x2="872" y2="208" stroke="#e5e5e5" stroke-width="2"/><text x="42" y="232" font-size="12" font-weight="700" fill="#4b4b4b" text-anchor="start">/26</text><text x="177.04" y="232" font-size="12" font-weight="400" fill="#777777" text-anchor="start">255.255.255.192</text><text x="464.0" y="232" font-size="12" font-weight="400" fill="#777777" text-anchor="start">64</text><text x="666.56" y="232" font-size="12" font-weight="400" fill="#777777" text-anchor="start">62</text><rect x="28" y="246" width="844" height="38" fill="#f7f9fc"/><line x1="28" y1="246" x2="872" y2="246" stroke="#e5e5e5" stroke-width="2"/><text x="42" y="270" font-size="12" font-weight="700" fill="#4b4b4b" text-anchor="start">/27</text><text x="177.04" y="270" font-size="12" font-weight="400" fill="#777777" text-anchor="start">255.255.255.224</text><text x="464.0" y="270" font-size="12" font-weight="400" fill="#777777" text-anchor="start">32</text><text x="666.56" y="270" font-size="12" font-weight="400" fill="#777777" text-anchor="start">30</text><line x1="28" y1="284" x2="872" y2="284" stroke="#e5e5e5" stroke-width="2"/><text x="42" y="308" font-size="12" font-weight="700" fill="#4b4b4b" text-anchor="start">/28</text><text x="177.04" y="308" font-size="12" font-weight="400" fill="#777777" text-anchor="start">255.255.255.240</text><text x="464.0" y="308" font-size="12" font-weight="400" fill="#777777" text-anchor="start">16</text><text x="666.56" y="308" font-size="12" font-weight="400" fill="#777777" text-anchor="start">14</text><rect x="28" y="322" width="844" height="38" fill="#f7f9fc"/><line x1="28" y1="322" x2="872" y2="322" stroke="#e5e5e5" stroke-width="2"/><text x="42" y="346" font-size="12" font-weight="700" fill="#4b4b4b" text-anchor="start">/29</text><text x="177.04" y="346" font-size="12" font-weight="400" fill="#777777" text-anchor="start">255.255.255.248</text><text x="464.0" y="346" font-size="12" font-weight="400" fill="#777777" text-anchor="start">8</text><text x="666.56" y="346" font-size="12" font-weight="400" fill="#777777" text-anchor="start">6</text><line x1="28" y1="360" x2="872" y2="360" stroke="#e5e5e5" stroke-width="2"/><text x="42" y="384" font-size="12" font-weight="700" fill="#4b4b4b" text-anchor="start">/30</text><text x="177.04" y="384" font-size="12" font-weight="400" fill="#777777" text-anchor="start">255.255.255.252</text><text x="464.0" y="384" font-size="12" font-weight="400" fill="#777777" text-anchor="start">4</text><text x="666.56" y="384" font-size="12" font-weight="400" fill="#777777" text-anchor="start">2</text><rect x="28" y="92" width="844" height="306" rx="12" fill="none" stroke="#e5e5e5" stroke-width="2"/><rect x="28" y="416" width="844" height="44" rx="12" fill="#f7f9fc" stroke="#e5e5e5" stroke-width="2"/><text x="450.0" y="443" font-size="12.5" font-weight="400" fill="#777777" text-anchor="middle">Usable hosts is always block size minus two - the network address and the broadcast address.</text></svg>