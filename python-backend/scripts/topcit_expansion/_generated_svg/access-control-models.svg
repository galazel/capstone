<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 368" width="900" height="368" font-family="system-ui, -apple-system, 'Segoe UI', Nunito, 'Helvetica Neue', Arial, sans-serif" role="img" aria-label="The four access control models"><defs><marker id="tip" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#afafaf"/></marker></defs><rect width="900" height="368" fill="#ffffff"/><text x="28" y="40" font-size="19" font-weight="800" fill="#4b4b4b" text-anchor="start">The four access control models</text><text x="28" y="62" font-size="13" font-weight="400" fill="#777777" text-anchor="start">The models differ chiefly in who is permitted to change a permission.</text><rect x="28" y="92" width="844" height="192" rx="12" fill="#ffffff" stroke="#e5e5e5" stroke-width="2"/><rect x="28" y="92" width="844" height="40" rx="12" fill="#f7f9fc"/><rect x="28" y="120" width="844" height="12" fill="#f7f9fc"/><text x="42" y="117" font-size="12.5" font-weight="800" fill="#4b4b4b" text-anchor="start">Model</text><text x="151.72" y="117" font-size="12.5" font-weight="800" fill="#4b4b4b" text-anchor="start">Who decides</text><text x="337.4" y="117" font-size="12.5" font-weight="800" fill="#4b4b4b" text-anchor="start">Basis of the decision</text><text x="607.48" y="117" font-size="12.5" font-weight="800" fill="#4b4b4b" text-anchor="start">Typical use</text><line x1="28" y1="132" x2="872" y2="132" stroke="#e5e5e5" stroke-width="2"/><text x="42" y="156" font-size="12" font-weight="700" fill="#4b4b4b" text-anchor="start">DAC</text><text x="151.72" y="156" font-size="12" font-weight="400" fill="#777777" text-anchor="start">The data owner</text><text x="337.4" y="156" font-size="12" font-weight="400" fill="#777777" text-anchor="start">Owner's discretion</text><text x="607.48" y="156" font-size="12" font-weight="400" fill="#777777" text-anchor="start">File systems</text><rect x="28" y="170" width="844" height="38" fill="#f7f9fc"/><line x1="28" y1="170" x2="872" y2="170" stroke="#e5e5e5" stroke-width="2"/><text x="42" y="194" font-size="12" font-weight="700" fill="#4b4b4b" text-anchor="start">MAC</text><text x="151.72" y="194" font-size="12" font-weight="400" fill="#777777" text-anchor="start">The system</text><text x="337.4" y="194" font-size="12" font-weight="400" fill="#777777" text-anchor="start">Clearance versus label</text><text x="607.48" y="194" font-size="12" font-weight="400" fill="#777777" text-anchor="start">Military, multi-level</text><line x1="28" y1="208" x2="872" y2="208" stroke="#e5e5e5" stroke-width="2"/><text x="42" y="232" font-size="12" font-weight="700" fill="#4b4b4b" text-anchor="start">RBAC</text><text x="151.72" y="232" font-size="12" font-weight="400" fill="#777777" text-anchor="start">The administrator</text><text x="337.4" y="232" font-size="12" font-weight="400" fill="#777777" text-anchor="start">The subject's role</text><text x="607.48" y="232" font-size="12" font-weight="400" fill="#777777" text-anchor="start">Most enterprises</text><rect x="28" y="246" width="844" height="38" fill="#f7f9fc"/><line x1="28" y1="246" x2="872" y2="246" stroke="#e5e5e5" stroke-width="2"/><text x="42" y="270" font-size="12" font-weight="700" fill="#4b4b4b" text-anchor="start">ABAC</text><text x="151.72" y="270" font-size="12" font-weight="400" fill="#777777" text-anchor="start">A policy engine</text><text x="337.4" y="270" font-size="12" font-weight="400" fill="#777777" text-anchor="start">Attributes and context</text><text x="607.48" y="270" font-size="12" font-weight="400" fill="#777777" text-anchor="start">Cloud, fine-grained</text><rect x="28" y="92" width="844" height="192" rx="12" fill="none" stroke="#e5e5e5" stroke-width="2"/><rect x="28" y="302" width="844" height="44" rx="12" fill="#f7f9fc" stroke="#e5e5e5" stroke-width="2"/><text x="450.0" y="329" font-size="12.5" font-weight="400" fill="#777777" text-anchor="middle">RBAC scales administratively because permissions attach to roles, not to individual people.</text></svg>