<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 268" width="900" height="268" font-family="system-ui, -apple-system, 'Segoe UI', Nunito, 'Helvetica Neue', Arial, sans-serif" role="img" aria-label="The attack chain"><defs><marker id="tip" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#afafaf"/></marker></defs><rect width="900" height="268" fill="#ffffff"/><text x="28" y="40" font-size="19" font-weight="800" fill="#4b4b4b" text-anchor="start">The attack chain</text><text x="28" y="62" font-size="13" font-weight="400" fill="#777777" text-anchor="start">An intrusion is a sequence, not a single event.</text><rect x="28.0" y="92" width="98.28571428571429" height="86" rx="12" fill="#ffffff" stroke="#e5e5e5" stroke-width="2"/><rect x="28.0" y="102" width="6" height="66" rx="3" fill="#1cb0f6"/><text x="77.14285714285714" y="125.5" font-size="14" font-weight="700" fill="#4b4b4b" text-anchor="middle">Reconnaissance</text><text x="77.14285714285714" y="144.5" font-size="12" font-weight="400" fill="#777777" text-anchor="middle">study the</text><text x="77.14285714285714" y="158.5" font-size="12" font-weight="400" fill="#777777" text-anchor="middle">target</text><line x1="131.28571428571428" y1="135.0" x2="147.28571428571428" y2="135.0" stroke="#afafaf" stroke-width="2" marker-end="url(#tip)"/><rect x="152.28571428571428" y="92" width="98.28571428571429" height="86" rx="12" fill="#ffffff" stroke="#e5e5e5" stroke-width="2"/><rect x="152.28571428571428" y="102" width="6" height="66" rx="3" fill="#00b8d4"/><text x="201.42857142857142" y="125.5" font-size="14" font-weight="700" fill="#4b4b4b" text-anchor="middle">Weaponisation</text><text x="201.42857142857142" y="144.5" font-size="12" font-weight="400" fill="#777777" text-anchor="middle">build the</text><text x="201.42857142857142" y="158.5" font-size="12" font-weight="400" fill="#777777" text-anchor="middle">payload</text><line x1="255.57142857142856" y1="135.0" x2="271.57142857142856" y2="135.0" stroke="#afafaf" stroke-width="2" marker-end="url(#tip)"/><rect x="276.57142857142856" y="92" width="98.28571428571429" height="86" rx="12" fill="#ffffff" stroke="#e5e5e5" stroke-width="2"/><rect x="276.57142857142856" y="102" width="6" height="66" rx="3" fill="#1b6ef3"/><text x="325.7142857142857" y="125.5" font-size="14" font-weight="700" fill="#4b4b4b" text-anchor="middle">Delivery</text><text x="325.7142857142857" y="144.5" font-size="12" font-weight="400" fill="#777777" text-anchor="middle">get it to the</text><text x="325.7142857142857" y="158.5" font-size="12" font-weight="400" fill="#777777" text-anchor="middle">target</text><line x1="379.85714285714283" y1="135.0" x2="395.85714285714283" y2="135.0" stroke="#afafaf" stroke-width="2" marker-end="url(#tip)"/><rect x="400.8571428571429" y="92" width="98.28571428571429" height="86" rx="12" fill="#ffffff" stroke="#e5e5e5" stroke-width="2"/><rect x="400.8571428571429" y="102" width="6" height="66" rx="3" fill="#ff9600"/><text x="450.00000000000006" y="125.5" font-size="14" font-weight="700" fill="#4b4b4b" text-anchor="middle">Exploitation</text><text x="450.00000000000006" y="144.5" font-size="12" font-weight="400" fill="#777777" text-anchor="middle">trigger the</text><text x="450.00000000000006" y="158.5" font-size="12" font-weight="400" fill="#777777" text-anchor="middle">flaw</text><line x1="504.14285714285717" y1="135.0" x2="520.1428571428571" y2="135.0" stroke="#afafaf" stroke-width="2" marker-end="url(#tip)"/><rect x="525.1428571428571" y="92" width="98.28571428571429" height="86" rx="12" fill="#ffffff" stroke="#e5e5e5" stroke-width="2"/><rect x="525.1428571428571" y="102" width="6" height="66" rx="3" fill="#1cb0f6"/><text x="574.2857142857142" y="125.5" font-size="14" font-weight="700" fill="#4b4b4b" text-anchor="middle">Installation</text><text x="574.2857142857142" y="144.5" font-size="12" font-weight="400" fill="#777777" text-anchor="middle">establish a</text><text x="574.2857142857142" y="158.5" font-size="12" font-weight="400" fill="#777777" text-anchor="middle">foothold</text><line x1="628.4285714285714" y1="135.0" x2="644.4285714285714" y2="135.0" stroke="#afafaf" stroke-width="2" marker-end="url(#tip)"/><rect x="649.4285714285714" y="92" width="98.28571428571429" height="86" rx="12" fill="#ffffff" stroke="#e5e5e5" stroke-width="2"/><rect x="649.4285714285714" y="102" width="6" height="66" rx="3" fill="#00b8d4"/><text x="698.5714285714286" y="117.0" font-size="14" font-weight="700" fill="#4b4b4b" text-anchor="middle">Command and</text><text x="698.5714285714286" y="134.0" font-size="14" font-weight="700" fill="#4b4b4b" text-anchor="middle">control</text><text x="698.5714285714286" y="153.0" font-size="12" font-weight="400" fill="#777777" text-anchor="middle">take remote</text><text x="698.5714285714286" y="167.0" font-size="12" font-weight="400" fill="#777777" text-anchor="middle">direction</text><line x1="752.7142857142858" y1="135.0" x2="768.7142857142858" y2="135.0" stroke="#afafaf" stroke-width="2" marker-end="url(#tip)"/><rect x="773.7142857142858" y="92" width="98.28571428571429" height="86" rx="12" fill="#ffffff" stroke="#e5e5e5" stroke-width="2"/><rect x="773.7142857142858" y="102" width="6" height="66" rx="3" fill="#1b6ef3"/><text x="822.8571428571429" y="125.5" font-size="14" font-weight="700" fill="#4b4b4b" text-anchor="middle">Actions</text><text x="822.8571428571429" y="144.5" font-size="12" font-weight="400" fill="#777777" text-anchor="middle">achieve the</text><text x="822.8571428571429" y="158.5" font-size="12" font-weight="400" fill="#777777" text-anchor="middle">objective</text><rect x="28" y="198" width="844" height="46" rx="12" fill="#f7f9fc" stroke="#e5e5e5" stroke-width="2"/><text x="450.0" y="226" font-size="12.5" font-weight="400" fill="#777777" text-anchor="middle">The defender only has to break the chain once - which is why detection early in the chain is worth far more than detection at the end.</text></svg>