<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 452" width="900" height="452" font-family="system-ui, -apple-system, 'Segoe UI', Nunito, 'Helvetica Neue', Arial, sans-serif" role="img" aria-label="VLANs: one switch, several broadcast domains"><defs><marker id="tip" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#afafaf"/></marker></defs><rect width="900" height="452" fill="#ffffff"/><text x="28" y="40" font-size="19" font-weight="800" fill="#4b4b4b" text-anchor="start">VLANs: one switch, several broadcast domains</text><text x="28" y="62" font-size="13" font-weight="400" fill="#777777" text-anchor="start">Ports are assigned to VLANs; frames carry an 802.1Q tag on the trunk.</text><line x1="431.0" y1="152" x2="510.0" y2="204" stroke="#e5e5e5" stroke-width="2"/><line x1="589.0" y1="152" x2="510.0" y2="204" stroke="#e5e5e5" stroke-width="2"/><line x1="510.0" y1="260" x2="352.0" y2="312" stroke="#e5e5e5" stroke-width="2"/><line x1="510.0" y1="260" x2="510.0" y2="312" stroke="#e5e5e5" stroke-width="2"/><line x1="510.0" y1="260" x2="668.0" y2="312" stroke="#e5e5e5" stroke-width="2"/><text x="28" y="126" font-size="12" font-weight="800" fill="#777777" text-anchor="start">Router</text><rect x="361.0" y="96" width="140" height="56" rx="12" fill="#ffffff" stroke="#e5e5e5" stroke-width="2"/><rect x="361.0" y="106" width="6" height="36" rx="3" fill="#1b6ef3"/><text x="431.0" y="128.5" font-size="14" font-weight="700" fill="#4b4b4b" text-anchor="middle">Router on a stick</text><rect x="519.0" y="96" width="140" height="56" rx="12" fill="#ffffff" stroke="#e5e5e5" stroke-width="2"/><rect x="519.0" y="106" width="6" height="36" rx="3" fill="#1b6ef3"/><text x="589.0" y="128.5" font-size="14" font-weight="700" fill="#4b4b4b" text-anchor="middle">802.1Q trunk</text><text x="28" y="234" font-size="12" font-weight="800" fill="#777777" text-anchor="start">Switch</text><rect x="440.0" y="204" width="140" height="56" rx="12" fill="#ffffff" stroke="#e5e5e5" stroke-width="2"/><rect x="440.0" y="214" width="6" height="36" rx="3" fill="#1cb0f6"/><text x="510.0" y="236.5" font-size="14" font-weight="700" fill="#4b4b4b" text-anchor="middle">Access switch</text><text x="28" y="342" font-size="12" font-weight="800" fill="#777777" text-anchor="start">Hosts</text><rect x="282.0" y="312" width="140" height="56" rx="12" fill="#ffffff" stroke="#e5e5e5" stroke-width="2"/><rect x="282.0" y="322" width="6" height="36" rx="3" fill="#00b8d4"/><text x="352.0" y="344.5" font-size="14" font-weight="700" fill="#4b4b4b" text-anchor="middle">VLAN 10 Finance</text><rect x="440.0" y="312" width="140" height="56" rx="12" fill="#ffffff" stroke="#e5e5e5" stroke-width="2"/><rect x="440.0" y="322" width="6" height="36" rx="3" fill="#00b8d4"/><text x="510.0" y="336.0" font-size="14" font-weight="700" fill="#4b4b4b" text-anchor="middle">VLAN 20</text><text x="510.0" y="353.0" font-size="14" font-weight="700" fill="#4b4b4b" text-anchor="middle">Engineering</text><rect x="598.0" y="312" width="140" height="56" rx="12" fill="#ffffff" stroke="#e5e5e5" stroke-width="2"/><rect x="598.0" y="322" width="6" height="36" rx="3" fill="#00b8d4"/><text x="668.0" y="344.5" font-size="14" font-weight="700" fill="#4b4b4b" text-anchor="middle">VLAN 30 Guest</text><rect x="28" y="386" width="844" height="44" rx="12" fill="#f7f9fc" stroke="#e5e5e5" stroke-width="2"/><text x="450.0" y="413" font-size="12.5" font-weight="400" fill="#777777" text-anchor="middle">Traffic between VLANs must pass the router, which is exactly where policy can be applied.</text></svg>