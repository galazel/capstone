<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 330" width="900" height="330" font-family="system-ui, -apple-system, 'Segoe UI', Nunito, 'Helvetica Neue', Arial, sans-serif" role="img" aria-label="Backup strategies compared"><defs><marker id="tip" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#afafaf"/></marker></defs><rect width="900" height="330" fill="#ffffff"/><text x="28" y="40" font-size="19" font-weight="800" fill="#4b4b4b" text-anchor="start">Backup strategies compared</text><text x="28" y="62" font-size="13" font-weight="400" fill="#777777" text-anchor="start">The three strategies trade backup cost against restore cost.</text><rect x="28" y="92" width="844" height="154" rx="12" fill="#ffffff" stroke="#e5e5e5" stroke-width="2"/><rect x="28" y="92" width="844" height="40" rx="12" fill="#f7f9fc"/><rect x="28" y="120" width="844" height="12" fill="#f7f9fc"/><text x="42" y="117" font-size="12.5" font-weight="800" fill="#4b4b4b" text-anchor="start">Strategy</text><text x="185.48000000000002" y="117" font-size="12.5" font-weight="800" fill="#4b4b4b" text-anchor="start">What it copies</text><text x="447.12" y="117" font-size="12.5" font-weight="800" fill="#4b4b4b" text-anchor="start">Backup time</text><text x="590.6" y="117" font-size="12.5" font-weight="800" fill="#4b4b4b" text-anchor="start">Restore time</text><text x="734.08" y="117" font-size="12.5" font-weight="800" fill="#4b4b4b" text-anchor="start">Media needed</text><line x1="28" y1="132" x2="872" y2="132" stroke="#e5e5e5" stroke-width="2"/><text x="42" y="156" font-size="12" font-weight="700" fill="#4b4b4b" text-anchor="start">Full</text><text x="185.48000000000002" y="156" font-size="12" font-weight="400" fill="#777777" text-anchor="start">Everything, every time</text><text x="447.12" y="156" font-size="12" font-weight="400" fill="#777777" text-anchor="start">Longest</text><text x="590.6" y="156" font-size="12" font-weight="400" fill="#777777" text-anchor="start">Fastest</text><text x="734.08" y="156" font-size="12" font-weight="400" fill="#777777" text-anchor="start">Most</text><rect x="28" y="170" width="844" height="38" fill="#f7f9fc"/><line x1="28" y1="170" x2="872" y2="170" stroke="#e5e5e5" stroke-width="2"/><text x="42" y="194" font-size="12" font-weight="700" fill="#4b4b4b" text-anchor="start">Incremental</text><text x="185.48000000000002" y="194" font-size="12" font-weight="400" fill="#777777" text-anchor="start">Changes since last backup</text><text x="447.12" y="194" font-size="12" font-weight="400" fill="#777777" text-anchor="start">Shortest</text><text x="590.6" y="194" font-size="12" font-weight="400" fill="#777777" text-anchor="start">Slowest</text><text x="734.08" y="194" font-size="12" font-weight="400" fill="#777777" text-anchor="start">Least</text><line x1="28" y1="208" x2="872" y2="208" stroke="#e5e5e5" stroke-width="2"/><text x="42" y="232" font-size="12" font-weight="700" fill="#4b4b4b" text-anchor="start">Differential</text><text x="185.48000000000002" y="232" font-size="12" font-weight="400" fill="#777777" text-anchor="start">Changes since last full</text><text x="447.12" y="232" font-size="12" font-weight="400" fill="#777777" text-anchor="start">Medium</text><text x="590.6" y="232" font-size="12" font-weight="400" fill="#777777" text-anchor="start">Medium</text><text x="734.08" y="232" font-size="12" font-weight="400" fill="#777777" text-anchor="start">Medium</text><rect x="28" y="92" width="844" height="154" rx="12" fill="none" stroke="#e5e5e5" stroke-width="2"/><rect x="28" y="264" width="844" height="44" rx="12" fill="#f7f9fc" stroke="#e5e5e5" stroke-width="2"/><text x="450.0" y="291" font-size="12.5" font-weight="400" fill="#777777" text-anchor="middle">Incremental restores need the full plus every increment since - one missing increment breaks the chain.</text></svg>