<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 384" width="900" height="384" font-family="system-ui, -apple-system, 'Segoe UI', Nunito, 'Helvetica Neue', Arial, sans-serif" role="img" aria-label="Why organisations outsource - and what it costs them"><defs><marker id="tip" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#afafaf"/></marker></defs><rect width="900" height="384" fill="#ffffff"/><text x="28" y="40" font-size="19" font-weight="800" fill="#4b4b4b" text-anchor="start">Why organisations outsource - and what it costs them</text><text x="28" y="62" font-size="13" font-weight="400" fill="#777777" text-anchor="start">Outsourcing transfers execution; it never transfers accountability.</text><rect x="28.0" y="92" width="411.0" height="208" rx="12" fill="#ffffff" stroke="#e5e5e5" stroke-width="2"/><rect x="28.0" y="92" width="411.0" height="42" rx="12" fill="#1cb0f6"/><rect x="28.0" y="118" width="411.0" height="16" fill="#1cb0f6"/><text x="233.5" y="119" font-size="14" font-weight="800" fill="#ffffff" text-anchor="middle">Drivers</text><text x="233.5" y="152" font-size="11.5" font-weight="400" fill="#777777" text-anchor="middle">the reasons given</text><circle cx="46.0" cy="166" r="3" fill="#1cb0f6"/><text x="58.0" y="170" font-size="12" font-weight="400" fill="#4b4b4b" text-anchor="start">Cost reduction</text><circle cx="46.0" cy="192" r="3" fill="#1cb0f6"/><text x="58.0" y="196" font-size="12" font-weight="400" fill="#4b4b4b" text-anchor="start">Access to scarce skills</text><circle cx="46.0" cy="218" r="3" fill="#1cb0f6"/><text x="58.0" y="222" font-size="12" font-weight="400" fill="#4b4b4b" text-anchor="start">Focus on core business</text><circle cx="46.0" cy="244" r="3" fill="#1cb0f6"/><text x="58.0" y="248" font-size="12" font-weight="400" fill="#4b4b4b" text-anchor="start">Faster scaling</text><circle cx="46.0" cy="270" r="3" fill="#1cb0f6"/><text x="58.0" y="274" font-size="12" font-weight="400" fill="#4b4b4b" text-anchor="start">Converting fixed cost to variable</text><rect x="461.0" y="92" width="411.0" height="208" rx="12" fill="#ffffff" stroke="#e5e5e5" stroke-width="2"/><rect x="461.0" y="92" width="411.0" height="42" rx="12" fill="#ff9600"/><rect x="461.0" y="118" width="411.0" height="16" fill="#ff9600"/><text x="666.5" y="119" font-size="14" font-weight="800" fill="#ffffff" text-anchor="middle">Risks</text><text x="666.5" y="152" font-size="11.5" font-weight="400" fill="#777777" text-anchor="middle">what comes with it</text><circle cx="479.0" cy="166" r="3" fill="#ff9600"/><text x="491.0" y="170" font-size="12" font-weight="400" fill="#4b4b4b" text-anchor="start">Loss of internal capability</text><circle cx="479.0" cy="192" r="3" fill="#ff9600"/><text x="491.0" y="196" font-size="12" font-weight="400" fill="#4b4b4b" text-anchor="start">Supplier lock-in</text><circle cx="479.0" cy="218" r="3" fill="#ff9600"/><text x="491.0" y="222" font-size="12" font-weight="400" fill="#4b4b4b" text-anchor="start">Accountability stays with the client</text><circle cx="479.0" cy="244" r="3" fill="#ff9600"/><text x="491.0" y="248" font-size="12" font-weight="400" fill="#4b4b4b" text-anchor="start">Watermelon SLAs</text><circle cx="479.0" cy="270" r="3" fill="#ff9600"/><text x="491.0" y="274" font-size="12" font-weight="400" fill="#4b4b4b" text-anchor="start">Exit is expensive if unplanned</text><rect x="28" y="318" width="844" height="44" rx="12" fill="#f7f9fc" stroke="#e5e5e5" stroke-width="2"/><text x="450.0" y="345" font-size="12.5" font-weight="400" fill="#777777" text-anchor="middle">The client remains answerable to its own customers and regulators no matter who performs the work.</text></svg>