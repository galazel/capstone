<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 262" width="900" height="262" font-family="system-ui, -apple-system, 'Segoe UI', Nunito, 'Helvetica Neue', Arial, sans-serif" role="img" aria-label="192.168.10.130 /26 split by its mask"><defs><marker id="tip" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#afafaf"/></marker></defs><rect width="900" height="262" fill="#ffffff"/><text x="28" y="40" font-size="19" font-weight="800" fill="#4b4b4b" text-anchor="start">192.168.10.130 /26 split by its mask</text><text x="28" y="62" font-size="13" font-weight="400" fill="#777777" text-anchor="start">The mask says where the network part ends and the host part begins.</text><rect x="28" y="100" width="685.75" height="74" rx="12" fill="#f7f9fc" stroke="#1b6ef3" stroke-width="2"/><rect x="28" y="100" width="685.75" height="26" rx="12" fill="#1b6ef3"/><rect x="28" y="114" width="685.75" height="12" fill="#1b6ef3"/><text x="370.875" y="118" font-size="12" font-weight="800" fill="#ffffff" text-anchor="middle">Network - 26 bits</text><text x="370.875" y="155" font-size="13.5" font-weight="700" fill="#4b4b4b" text-anchor="middle">192.168.10.128</text><rect x="713.75" y="100" width="158.25" height="74" rx="12" fill="#f7f9fc" stroke="#00b8d4" stroke-width="2"/><rect x="713.75" y="100" width="158.25" height="26" rx="12" fill="#00b8d4"/><rect x="713.75" y="114" width="158.25" height="12" fill="#00b8d4"/><text x="792.875" y="118" font-size="12" font-weight="800" fill="#ffffff" text-anchor="middle">Host - 6 bits</text><text x="792.875" y="155" font-size="13.5" font-weight="700" fill="#4b4b4b" text-anchor="middle">.130</text><rect x="28" y="194" width="844" height="46" rx="12" fill="#ffffff" stroke="#e5e5e5" stroke-width="2"/><text x="450.0" y="222" font-size="12.5" font-weight="400" fill="#777777" text-anchor="middle">/26 leaves 6 host bits: 64 addresses, of which 62 are usable once network and b