<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 482" width="900" height="482" font-family="system-ui, -apple-system, 'Segoe UI', Nunito, 'Helvetica Neue', Arial, sans-serif" role="img" aria-label="The OSI Reference Model"><defs><marker id="tip" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#afafaf"/></marker></defs><rect width="900" height="482" fill="#ffffff"/><text x="28" y="40" font-size="19" font-weight="800" fill="#4b4b4b" text-anchor="start">The OSI Reference Model</text><text x="28" y="62" font-size="13" font-weight="400" fill="#777777" text-anchor="start">Seven layers, each using only the service below it and serving only the one above.</text><rect x="28" y="88" width="780" height="46" rx="12" fill="#f7f9fc" stroke="#e5e5e5" stroke-width="2"/><rect x="28" y="88" width="6" height="46" rx="3" fill="#1cb0f6"/><circle cx="62" cy="111.0" r="14" fill="#1cb0f6"/><text x="62" y="116.0" font-size="13" font-weight="800" fill="#ffffff" text-anchor="middle">7</text><text x="88" y="116.0" font-size="14" font-weight="700" fill="#4b4b4b" text-anchor="start">Application</text><text x="796" y="116.0" font-size="12" font-weight="400" fill="#777777" text-anchor="end">HTTP, SMTP, DNS</text><rect x="28" y="142" width="780" height="46" rx="12" fill="#f7f9fc" stroke="#e5e5e5" stroke-width="2"/><rect x="28" y="142" width="6" height="46" rx="3" fill="#1b6ef3"/><circle cx="62" cy="165.0" r="14" fill="#1b6ef3"/><text x="62" y="170.0" font-size="13" font-weight="800" fill="#ffffff" text-anchor="middle">6</text><text x="88" y="170.0" font-size="14" font-weight="700" fill="#4b4b4b" text-anchor="start">Presentation</text><text x="796" y="170.0" font-size="12" font-weight="400" fill="#777777" text-anchor="end">encoding, encryption, compression</text><rect x="28" y="196" width="780" height="46" rx="12" fill="#f7f9fc" stroke="#e5e5e5" stroke-width="2"/><rect x="28" y="196" width="6" height="46" rx="3" fill="#00b8d4"/><circle cx="62" cy="219.0" r="14" fill="#00b8d4"/><text x="62" y="224.0" font-size="13" font-weight="800" fill="#ffffff" text-anchor="middle">5</text><text x="88" y="224.0" font-size="14" font-weight="700" fill="#4b4b4b" text-anchor="start">Session</text><text x="796" y="224.0" font-size="12" font-weight="400" fill="#777777" text-anchor="end">dialogue setup and teardown</text><rect x="28" y="250" width="780" height="46" rx="12" fill="#f7f9fc" stroke="#e5e5e5" stroke-width="2"/><rect x="28" y="250" width="6" height="46" rx="3" fill="#1cb0f6"/><circle cx="62" cy="273.0" r="14" fill="#1cb0f6"/><text x="62" y="278.0" font-size="13" font-weight="800" fill="#ffffff" text-anchor="middle">4</text><text x="88" y="278.0" font-size="14" font-weight="700" fill="#4b4b4b" text-anchor="start">Transport</text><text x="796" y="278.0" font-size="12" font-weight="400" fill="#777777" text-anchor="end">segments - TCP, UDP, ports</text><rect x="28" y="304" width="780" height="46" rx="12" fill="#f7f9fc" stroke="#e5e5e5" stroke-width="2"/><rect x="28" y="304" width="6" height="46" rx="3" fill="#1b6ef3"/><circle cx="62" cy="327.0" r="14" fill="#1b6ef3"/><text x="62" y="332.0" font-size="13" font-weight="800" fill="#ffffff" text-anchor="middle">3</text><text x="88" y="332.0" font-size="14" font-weight="700" fill="#4b4b4b" text-anchor="start">Network</text><text x="796" y="332.0" font-size="12" font-weight="400" fill="#777777" text-anchor="end">packets - IP, routing between networks</text><rect x="28" y="358" width="780" height="46" rx="12" fill="#f7f9fc" stroke="#e5e5e5" stroke-width="2"/><rect x="28" y="358" width="6" height="46" rx="3" fill="#00b8d4"/><circle cx="62" cy="381.0" r="14" fill="#00b8d4"/><text x="62" y="386.0" font-size="13" font-weight="800" fill="#ffffff" text-anchor="middle">2</text><text x="88" y="386.0" font-size="14" font-weight="700" fill="#4b4b4b" text-anchor="start">Data Link</text><text x="796" y="386.0" font-size="12" font-weight="400" fill="#777777" text-anchor="end">frames - MAC addressing on one link</text><rect x="28" y="412" width="780" height="46" rx="12" fill="#f7f9fc" stroke="#e5e5e5" stroke-width="2"/><rect x="28" y="412" width="6" height="46" rx="3" fill="#1cb0f6"/><circle cx="62" cy="435.0" r="14" fill="#1cb0f6"/><text x="62" y="440.0" font-size="13" font-weight="800" fill="#ffffff" text-anchor="middle">1</text><text x="88" y="440.0" font-size="14" font-weight="700" fill="#4b4b4b" text-anchor="start">Physical</text><text x="796" y="440.0" font-size="12" font-weight="400" fill="#777777" text-anchor="end">bits - voltages, light, radio</text></svg>