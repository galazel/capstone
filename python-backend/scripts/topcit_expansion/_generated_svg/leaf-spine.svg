.5" font-size="14" font-weight="700" fill="#4b4b4b" text-anchor="middle">Spine 1</text><rect x="440.0" y="96" width="140" height="56" rx="12" fill="#ffffff" stroke="#e5e5e5" stroke-width="2"/><rect x="440.0" y="106" width="6" height="36" rx="3" fill="#1b6ef3"/><text x="510.0" y="128.5" font-size="14" font-weight="700" fill="#4b4b4b" text-anchor="middle">Spine 2</text><rect x="598.0" y="96" width="140" height="56" rx="12" fill="#ffffff" stroke="#e5e5e5" stroke-width="2"/><rect x="598.0" y="106" width="6" height="36" rx="3" fill="#1b6ef3"/><text x="668.0" y="128.5" font-size="14" font-weight="700" fill="#4b4b4b" text-anchor="middle">Spine 3</text><text x="28" y="234" font-size="12" font-weight="800" fill="#777777" text-anchor="start">Leaf</text><rect x="203.0" y="204" width="140" height="56" rx="12" fill="#ffffff" stroke="#e5e5e5" stroke-width="2"/><rect x="203.0" y="214" width="6" height="36" rx="3" fill="#1cb0f6"/><text x="273.0" y="236.5" font-size="14" font-weight="700" fill="#4b4b4b" text-anchor="middle">Leaf 1</text><rect x="361.0" y="204" width="140" height="56" rx="12" fill="#ffffff" stroke="#e5e5e5" stroke-width="2"/><rect x="361.0" y="214" width="6" height="36" rx="3" fill="#1cb0f6"/><text x="431.0" y="236.5" font-size="14" font-weight="700" fill="#4b4b4b" text-anchor="middle">Leaf 2</text><rect x="519.0" y="204" width="140" height="56" rx="12" fill="#ffffff" stroke="#e5e5e5" stroke-width="2"/><rect x="519.0" y="214" width="6" height="36" rx="3" fill="#1cb0f6"/><text x="589.0" y="236.5" font-size="14" font-weight="700" fill="#4b4b4b" text-anchor="middle">Leaf 3</text><rect x="677.0" y="204" width="140" height="56" rx="12" fill="#ffffff" stroke="#e5e5e5" stroke-width="2"/><rect x="677.0" y="214" width="6" height="36" rx="3" fill="#1cb0f6"/><text x="747.0" y="236.5" font-size="14" font-weight="700" fill="#4b4b4b" text-anchor="middle">Leaf 4</text><rect x="28" y="278" width="844" height="44" rx="12" fill="#f7f9fc" stroke="#e5e5e5" stroke-width="2"/><text x="450