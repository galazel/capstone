[tool.ruff]
target-version = "py311"
line-length = 100

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "SIM"]
ignore = ["E501"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"
# Graph nodes are async (Phase 2a step 4), so graph tests must await
# ainvoke. auto mode avoids decorating every async test individually.
asyncio_mode = "auto"
