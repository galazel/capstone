<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 406" width="900" height="406" font-family="system-ui, -apple-system, 'Segoe UI', Nunito, 'Helvetica Neue', Arial, sans-serif" role="img" aria-label="The historical IPv4 address classes"><defs><marker id="tip" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#afafaf"/></marker></defs><rect width="900" height="406" fill="#ffffff"/><text x="28" y="40" font-size="19" font-weight="800" fill="#4b4b4b" text-anchor="start">The historical IPv4 address classes</text><text x="28" y="62" font-size="13" font-weight="400" fill="#777777" text-anchor="start">Classful addressing fixed the network/host split by the first bits of the address.</text><rect x="28" y="92" width="844" height="230" rx="12" fill="#ffffff" stroke="#e5e5e5" stroke-width="2"/><rect x="28" y="92" width="844" height="40" rx="12" fill="#f7f9fc"/><rect x="28" y="120" width="844" height="12" fill="#f7f9fc"/><text x="42" y="117" font-size="12.5" font-weight="800" fill="#4b4b4b" text-anchor="start">Class</text><text x="143.28" y="117" font-size="12.5" font-weight="800" fill="#4b4b4b" text-anchor="start">Leading bits</text><text x="278.32" y="117" font-size="12.5" font-weight="800" fill="#4b4b4b" text-anchor="start">First octet</text><text x="447.12" y="117" font-size="12.5" font-weight="800" fill="#4b4b4b" text-anchor="start">Default mask</text><text x="615.9200000000001" y="117" font-size="12.5" font-weight="800" fill="#4b4b4b" text-anchor="start">Hosts per network</text><line x1="28" y1="132" x2="872" y2="132" stroke="#e5e5e5" stroke-width="2"/><text x="42" y="156" font-size="12" font-weight="700" fill="#4b4b4b" text-anchor="start">A</text><text x="143.28" y="156" font-size="12" font-weight="400" fill="#777777" text-anchor="start">0</text><text x="278.32" y="156" font-size="12" font-weight="400" fill="#777777" text-anchor="start">1 - 126</text><text x="447.12" y="156" font-size="12" font-weight="400" fill="#777777" text-anchor="start">/8</text><text x="615.9200000000001" y="156" font-size="12" font-weight="400" fill="#777777" text-anchor="start">16,777,214</text><rect x="28" y="170" width="844" height="38" fill="#f7f9fc"/><line x1="28" y1="170" x2="872" y2="170" stroke="#e5e5e5" stroke-width="2"/><text x="42" y="194" font-size="12" font-weight="700" fill="#4b4b4b" text-anchor="start">B</text><text x="143.28" y="194" font-size="12" font-weight="400" fill="#777777" text-anchor="start">10</text><text x="278.32" y="194" font-size="12" font-weight="400" fill="#777777" text-anchor="start">128 - 191</text><text x="447.12" y="194" font-size="12" font-weight="400" fill="#777777" text-anchor="start">/16</text><text x="615.9200000000001" y="194" font-size="12" font-weight="400" fill="#777777" text-anchor="start">65,534</text><line x1="28" y1="208" x2="872" y2="208" stroke="#e5e5e5" stroke-width="2"/><text x="42" y="232" font-size="12" font-weight="700" fill="#4b4b4b" text-anchor="start">C</text><text x="143.28" y="232" font-size="12" font-weight="400" fill="#777777" text-anchor="start">110</text><text x="278.32" y="232" font-size="12" font-weight="400" fill="#777777" text-anchor="start">192 - 223</text><text x="447.12" y="232" font-size="12" font-weight="400" fill="#777777" text-anchor="start">/24</text><text x="615.9200000000001" y="232" font-size="12" font-weight="400" fill="#777777" text-anchor="start">254</text><rect x="28" y="246" width="844" height="38" fill="#f7f9fc"/><line x1="28" y1="246" x2="872" y2="246" stroke="#e5e5e5" stroke-width="2"/><text x="42" y="270" font-size="12" font-weight="700" fill="#4b4b4b" text-anchor="start">D</text><text x="143.28" y="270" font-size="12" font-weight="400" fill="#777777" text-anchor="start">1110</text><text x="278.32" y="270" font-size="12" font-weight="400" fill="#777777" text-anchor="start">224 - 239</text><text x="447.12" y="270" font-size="12" font-weight="400" fill="#777777" text-anchor="start">multicast</text><text x="615.9200000000001" y="270" font-size="12" font-weight="400" fill="#777777" text-anchor="start">not applicable</text><line x1="28" y1="284" x2="872" y2="284" stroke="#e5e5e5" stroke-width="2"/><text x="42" y="308" font-size="12" font-weight="700" fill="#4b4b4b" text-anchor="start">E</text><text x="143.28" y="308" font-size="12" font-weight="400" fill="#777777" text-anchor="start">1111</text><text x="278.32" y="308" font-size="12" font-weight="400" fill="#777777" text-anchor="start">240 - 255</text><text x="447.12" y="308" font-size="12" font-weight="400" fill="#777777" text-anchor="start">reserved</text><text x="615.9200000000001" y="308" font-size="12" font-weight="400" fill="#777777" text-anchor="start">not applicable</text><rect x="28" y="92" width="844" height="230" rx="12" fill="none" stroke="#e5e5e5" stroke-width="2"/><rect x="28" y="340" width="844" height="44" rx="12" fill="#f7f9fc" stroke="#e5e5e5" stroke-width="2"/><text x="450.0" y="367" font-size="12.5" font-weight="400" fill="#777777" text-anchor="middle">Classes wasted addresses badly - a site needing 300 hosts had to take a whole Class B. CIDR replaced them.</text></svg>