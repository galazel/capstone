<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 262" width="900" height="262" font-family="system-ui, -apple-system, 'Segoe UI', Nunito, 'Helvetica Neue', Arial, sans-serif" role="img" aria-label="MAC address: 48 bits in two halves"><defs><marker id="tip" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#afafaf"/></marker></defs><rect width="900" height="262" fill="#ffffff"/><text x="28" y="40" font-size="19" font-weight="800" fill="#4b4b4b" text-anchor="start">MAC address: 48 bits in two halves</text><text x="28" y="62" font-size="13" font-weight="400" fill="#777777" text-anchor="start">A MAC address is flat and permanent: it identifies the card, not where it is.</text><rect x="28" y="100" width="422.0" height="74" rx="12" fill="#f7f9fc" stroke="#1b6ef3" stroke-width="2"/><rect x="28" y="100" width="422.0" height="26" rx="12" fill="#1b6ef3"/><rect x="28" y="114" width="422.0" height="12" fill="#1b6ef3"/><text x="239.0" y="118" font-size="12" font-weight="800" fill="#ffffff" text-anchor="middle">OUI - assigned to the vendor</text><text x="239.0" y="155" font-size="13.5" font-weight="700" fill="#4b4b4b" text-anchor="middle">00:1A:2B</text><rect x="450.0" y="100" width="422.0" height="74" rx="12" fill="#f7f9fc" stroke="#1cb0f6" stroke-width="2"/><rect x="450.0" y="100" width="422.0" height="26" rx="12" fill="#1cb0f6"/><rect x="450.0" y="114" width="422.0" height="12" fill="#1cb0f6"/><text x="661.0" y="118" font-size="12" font-weight="800" fill="#ffffff" text-anchor="middle">NIC - assigned by the vendor</text><text x="661.0" y="155" font-size="13.5" font-weight="700" fill="#4b4b4b" text-anchor="middle">3C:4D:5E</text><rect x="28" y="194" width="844" height="46" rx="12" fill="#ffffff" stroke="#e5e5e5" stroke-width="2"/><text x="450.0" y="222" font-size="12.5" font-weight="400" fill="#777777" text-anchor="middle">Because it carries no location, a MAC address cannot be routed - that is what IP is for.</text></svg>