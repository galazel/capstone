<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 356" width="900" height="356" font-family="system-ui, -apple-system, 'Segoe UI', Nunito, 'Helvetica Neue', Arial, sans-serif" role="img" aria-label="RTO and RPO measure different losses"><defs><marker id="tip" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#afafaf"/></marker></defs><rect width="900" height="356" fill="#ffffff"/><text x="28" y="40" font-size="19" font-weight="800" fill="#4b4b4b" text-anchor="start">RTO and RPO measure different losses</text><text x="28" y="62" font-size="13" font-weight="400" fill="#777777" text-anchor="start">RPO looks backwards from the incident; RTO looks forwards.</text><line x1="48" y1="200" x2="852" y2="200" stroke="#afafaf" stroke-width="3"/><rect x="150.0" y="148" width="300" height="44" rx="10" fill="#ff9600" opacity="0.16"/><rect x="450.0" y="148" width="300" height="44" rx="10" fill="#1cb0f6" opacity="0.16"/><text x="300.0" y="176" font-size="13.5" font-weight="800" fill="#ff9600" text-anchor="middle">RPO</text><text x="300.0" y="192" font-size="11.5" font-weight="400" fill="#777777" text-anchor="middle">how much data you can afford to lose</text><text x="600.0" y="176" font-size="13.5" font-weight="800" fill="#1b6ef3" text-anchor="middle">RTO</text><text x="600.0" y="192" font-size="11.5" font-weight="400" fill="#777777" text-anchor="middle">how long you can afford to be down</text><line x1="450.0" y1="138" x2="450.0" y2="234" stroke="#ff4b4b" stroke-width="3"/><circle cx="450.0" cy="200" r="9" fill="#ff4b4b"/><text x="450.0" y="254" font-size="13" font-weight="800" fill="#ff4b4b" text-anchor="middle">incident</text><text x="150.0" y="230" font-size="11.5" font-weight="400" fill="#777777" text-anchor="middle">last good backup</text><text x="750.0" y="230" font-size="11.5" font-weight="400" fill="#777777" text-anchor="middle">service restored</text><circle cx="150.0" cy="200" r="6" fill="#ff9600"/><circle cx="750.0" cy="200" r="6" fill="#1b6ef3"/><rect x="28" y="270" width="844" height="46" rx="12" fill="#f7f9fc" stroke="#e5e5e5" stroke-width="2"/><text x="450.0" y="298" font-size="12.5" font-weight="400" fill="#777777" text-anchor="middle">RPO is set by backup frequency. RTO is set by recovery capability. Tightening either one costs money.</text></svg>