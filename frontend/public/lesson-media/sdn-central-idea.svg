<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 454" width="900" height="454" font-family="system-ui, -apple-system, 'Segoe UI', Nunito, 'Helvetica Neue', Arial, sans-serif" role="img" aria-label="The central idea: separating control from forwarding"><defs><marker id="tip" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#afafaf"/></marker></defs><rect width="900" height="454" fill="#ffffff"/><text x="28" y="40" font-size="19" font-weight="800" fill="#4b4b4b" text-anchor="start">The central idea: separating control from forwarding</text><text x="28" y="62" font-size="13" font-weight="400" fill="#777777" text-anchor="start">SDN moves the decision out of the box and leaves the box forwarding.</text><rect x="28.0" y="92" width="409.0" height="242" rx="12" fill="#ffffff" stroke="#e5e5e5" stroke-width="2"/><rect x="28.0" y="92" width="409.0" height="40" rx="12" fill="#ff9600"/><rect x="28.0" y="118" width="409.0" height="14" fill="#ff9600"/><text x="232.5" y="118" font-size="14" font-weight="800" fill="#ffffff" text-anchor="middle">Traditional</text><rect x="42.0" y="144" width="381.0" height="50" rx="10" fill="#f7f9fc" stroke="#e5e5e5" stroke-width="2"/><text x="232.5" y="166" font-size="12.5" font-weight="700" fill="#4b4b4b" text-anchor="middle">Control plane</text><text x="232.5" y="183" font-size="11" font-weight="400" fill="#777777" text-anchor="middle">on every device</text><rect x="42.0" y="206" width="381.0" height="50" rx="10" fill="#f7f9fc" stroke="#e5e5e5" stroke-width="2"/><text x="232.5" y="228" font-size="12.5" font-weight="700" fill="#4b4b4b" text-anchor="middle">Data plane</text><text x="232.5" y="245" font-size="11" font-weight="400" fill="#777777" text-anchor="middle">on every device</text><rect x="42.0" y="268" width="381.0" height="50" rx="10" fill="#f7f9fc" stroke="#e5e5e5" stroke-width="2"/><text x="232.5" y="290" font-size="12.5" font-weight="700" fill="#4b4b4b" text-anchor="middle">Management</text><text x="232.5" y="307" font-size="11" font-weight="400" fill="#777777" text-anchor="middle">box by box, by hand</text><text x="232.5" y="354" font-size="11.5" font-weight="400" fill="#777777" text-anchor="middle">Every device decides for itself</text><rect x="463.0" y="92" width="409.0" height="242" rx="12" fill="#ffffff" stroke="#e5e5e5" stroke-width="2"/><rect x="463.0" y="92" width="409.0" height="40" rx="12" fill="#1b6ef3"/><rect x="463.0" y="118" width="409.0" height="14" fill="#1b6ef3"/><text x="667.5" y="118" font-size="14" font-weight="800" fill="#ffffff" text-anchor="middle">SDN</text><rect x="477.0" y="144" width="381.0" height="50" rx="10" fill="#f7f9fc" stroke="#e5e5e5" stroke-width="2"/><text x="667.5" y="166" font-size="12.5" font-weight="700" fill="#4b4b4b" text-anchor="middle">Controller</text><text x="667.5" y="183" font-size="11" font-weight="400" fill="#777777" text-anchor="middle">central control plane</text><rect x="477.0" y="206" width="381.0" height="50" rx="10" fill="#f7f9fc" stroke="#e5e5e5" stroke-width="2"/><text x="667.5" y="228" font-size="12.5" font-weight="700" fill="#4b4b4b" text-anchor="middle">Southbound API</text><text x="667.5" y="245" font-size="11" font-weight="400" fill="#777777" text-anchor="middle">OpenFlow to the switches</text><rect x="477.0" y="268" width="381.0" height="50" rx="10" fill="#f7f9fc" stroke="#e5e5e5" stroke-width="2"/><text x="667.5" y="290" font-size="12.5" font-weight="700" fill="#4b4b4b" text-anchor="middle">Data plane</text><text x="667.5" y="307" font-size="11" font-weight="400" fill="#777777" text-anchor="middle">switches only forward</text><text x="667.5" y="354" font-size="11.5" font-weight="400" fill="#777777" text-anchor="middle">One controller decides for all of them</text><rect x="28" y="368" width="844" height="46" rx="12" fill="#f7f9fc" stroke="#e5e5e5" stroke-width="2"/><text x="450.0" y="396" font-size="12.5" font-weight="400" fill="#777777" text-anchor="middle">Centralising control is what makes the network programmable - and what makes the controller worth protecting.</text></svg>