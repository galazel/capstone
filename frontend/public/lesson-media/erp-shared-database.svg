<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 452" width="900" height="452" font-family="system-ui, -apple-system, 'Segoe UI', Nunito, 'Helvetica Neue', Arial, sans-serif" role="img" aria-label="ERP: one shared database, many modules"><defs><marker id="tip" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#afafaf"/></marker></defs><rect width="900" height="452" fill="#ffffff"/><text x="28" y="40" font-size="19" font-weight="800" fill="#4b4b4b" text-anchor="start">ERP: one shared database, many modules</text><text x="28" y="62" font-size="13" font-weight="400" fill="#777777" text-anchor="start">The integration is the point: a sales order updates inventory and finance without re-keying.</text><line x1="450.0" y1="188.0" x2="450.0" y2="134.0" stroke="#e5e5e5" stroke-width="2"/><rect x="368.0" y="72.0" width="164" height="56" rx="12" fill="#ffffff" stroke="#e5e5e5" stroke-width="2"/><rect x="368.0" y="82.0" width="6" height="36" rx="3" fill="#1cb0f6"/><text x="450.0" y="104.5" font-size="14" font-weight="700" fill="#4b4b4b" text-anchor="middle">Finance</text><line x1="533.1384387633061" y1="219.0" x2="628.4012331795943" y2="192.0" stroke="#e5e5e5" stroke-width="2"/><rect x="600.0948082142295" y="147.0" width="164" height="56" rx="12" fill="#ffffff" stroke="#e5e5e5" stroke-width="2"/><rect x="600.0948082142295" y="157.0" width="6" height="36" rx="3" fill="#00b8d4"/><text x="682.0948082142295" y="179.5" font-size="14" font-weight="700" fill="#4b4b4b" text-anchor="middle">Human resources</text><line x1="533.1384387633061" y1="281.0" x2="628.4012331795944" y2="308.0" stroke="#e5e5e5" stroke-width="2"/><rect x="600.0948082142296" y="297.0" width="164" height="56" rx="12" fill="#ffffff" stroke="#e5e5e5" stroke-width="2"/><rect x="600.0948082142296" y="307.0" width="6" height="36" rx="3" fill="#1b6ef3"/><text x="682.0948082142296" y="329.5" font-size="14" font-weight="700" fill="#4b