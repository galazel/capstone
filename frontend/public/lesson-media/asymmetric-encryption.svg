<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 332" width="900" height="332" font-family="system-ui, -apple-system, 'Segoe UI', Nunito, 'Helvetica Neue', Arial, sans-serif" role="img" aria-label="Asymmetric encryption: a mathematically related key pair"><defs><marker id="tip" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#afafaf"/></marker></defs><rect width="900" height="332" fill="#ffffff"/><text x="28" y="40" font-size="19" font-weight="800" fill="#4b4b4b" text-anchor="start">Asymmetric encryption: a mathematically related key pair</text><text x="28" y="62" font-size="13" font-weight="400" fill="#777777" text-anchor="start">What one key does, only the other can undo.</text><rect x="28.0" y="92" width="411.0" height="156" rx="12" fill="#ffffff" stroke="#e5e5e5" stroke-width="2"/><rect x="28.0" y="92" width="411.0" height="42" rx="12" fill="#1cb0f6"/><rect x="28.0" y="118" width="411.0" height="16" fill="#1cb0f6"/><text x="233.5" y="119" font-size="14" font-weight="800" fill="#ffffff" text-anchor="middle">Public key</text><text x="233.5" y="152" font-size="11.5" font-weight="400" fill="#777777" text-anchor="middle">published to anyone</text><circle cx="46.0" cy="166" r="3" fill="#1cb0f6"/><text x="58.0" y="170" font-size="12" font-weight="400" fill="#4b4b4b" text-anchor="start">Encrypts to the owner</text><circle cx="46.0" cy="192" r="3" fill="#1cb0f6"/><text x="58.0" y="196" font-size="12" font-weight="400" fill="#4b4b4b" text-anchor="start">Verifies the owner's signature</text><circle cx="46.0" cy="218" r="3" fill="#1cb0f6"/><text x="58.0" y="222" font-size="12" font-weight="400" fill="#4b4b4b" text-anchor="start">Safe to distribute freely</text><rect x="461.0" y="92" width="411.0" height="156" rx="12" fill="#ffffff" stroke="#e5e5e5" stroke-width="2"/><rect x="461.0" y="92" width="411.0" height="42" rx="12" fill="#ff9600"/><rect x="461.0" y="118" width="411.0" height="16" fill="#ff9600"/><text x="666.5" y="119" font-size="14" font-weight="800" fill="#ffffff" text-anchor="middle">Private key</text><text x="666.5" y="152" font-size="11.5" font-weight="400" fill="#777777" text-anchor="middle">never leaves the owner</text><circle cx="479.0" cy="166" r="3" fill="#ff9600"/><text x="491.0" y="170" font-size="12" font-weight="400" fill="#4b4b4b" text-anchor="start">Decrypts what the public key sealed</text><circle cx="479.0" cy="192" r="3" fill="#ff9600"/><text x="491.0" y="196" font-size="12" font-weight="400" fill="#4b4b4b" text-anchor="start">Creates the owner's signature</text><circle cx="479.0" cy="218" r="3" fill="#ff9600"/><text x="491.0" y="222" font-size="12" font-weight="400" fill="#4b4b4b" text-anchor="start">Compromise ends the identity</text><rect x="28" y="266" width="844" height="44" rx="12" fill="#f7f9fc" stroke="#e5e5e5" stroke-width="2"/><text x="450.0" y="293" font-size="12.5" font-weight="400" fill="#777777" text-anchor="middle">Asymmetric work is far slower, so it is used to exchange a symmetric key - not to encrypt the bulk traffic.</text></svg>