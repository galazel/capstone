<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 406" width="900" height="406" font-family="system-ui, -apple-system, 'Segoe UI', Nunito, 'Helvetica Neue', Arial, sans-serif" role="img" aria-label="Network devices by the layer they act on"><defs><marker id="tip" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#afafaf"/></marker></defs><rect width="900" height="406" fill="#ffffff"/><text x="28" y="40" font-size="19" font-weight="800" fill="#4b4b4b" text-anchor="start">Network devices by the layer they act on</text><text x="28" y="62" font-size="13" font-weight="400" fill="#777777" text-anchor="start">The layer a device reads determines what it can separate.</text><rect x="28" y="92" width="844" height="230" rx="12" fill="#ffffff" stroke="#e5e5e5" stroke-width="2"/><rect x="28" y="92" width="844" height="40" rx="12" fill="#f7f9fc"/><rect x="28" y="120" width="844" height="12" fill="#f7f9fc"/><text x="42" y="117" font-size="12.5" font-weight="800" fill="#4b4b4b" text-anchor="start">Device</text><text x="193.92" y="117" font-size="12.5" font-weight="800" fill="#4b4b4b" text-anchor="start">Layer</text><text x="345.84" y="117" font-size="12.5" font-weight="800" fill="#4b4b4b" text-anchor="start">Forwards on</text><text x="565.28" y="117" font-size="12.5" font-weight="800" fill="#4b4b4b" text-anchor="start">Effect on domains</text><line x1="28" y1="132" x2="872" y2="132" stroke="#e5e5e5" stroke-width="2"/><text x="42" y="156" font-size="12" font-weight="700" fill="#4b4b4b" text-anchor="start">Hub</text><text x="193.92" y="156" font-size="12" font-weight="400" fill="#777777" text-anchor="start">1 - Physical</text><text x="345.84" y="156" font-size="12" font-weight="400" fill="#777777" text-anchor="start">Nothing; repeats bits</text><text x="565.28" y="156" font-size="12" font-weight="400" fill="#777777" text-anchor="start">One collision, one broadcast</text><rect x="28" y="170" width="844" height="38" fill="#f7f9fc"/><line x1="28" y1="170" x2="872" y2="170" stroke="#e5e5e5" stroke-width="2"/><text x="42" y="194" font-size="12" font-weight="700" fill="#4b4b4b" text-anchor="start">Switch</text><text x="193.92" y="194" font-size="12" font-weight="400" fill="#777777" text-anchor="start">2 - Data Link</text><text x="345.84" y="194" font-size="12" font-weight="400" fill="#777777" text-anchor="start">MAC address</text><text x="565.28" y="194" font-size="12" font-weight="400" fill="#777777" text-anchor="start">Splits collision domains</text><line x1="28" y1="208" x2="872" y2="208" stroke="#e5e5e5" stroke-width="2"/><text x="42" y="232" font-size="12" font-weight="700" fill="#4b4b4b" text-anchor="start">Router</text><text x="193.92" y="232" font-size="12" font-weight="400" fill="#777777" text-anchor="start">3 - Network</text><text x="345.84" y="232" font-size="12" font-weight="400" fill="#777777" text-anchor="start">IP address</text><text x="565.28" y="232" font-size="12" font-weight="400" fill="#777777" text-anchor="start">Splits broadcast domains</text><rect x="28" y="246" width="844" height="38" fill="#f7f9fc"/><line x1="28" y1="246" x2="872" y2="246" stroke="#e5e5e5" stroke-width="2"/><text x="42" y="270" font-size="12" font-weight="700" fill="#4b4b4b" text-anchor="start">L3 switch</text><text x="193.92" y="270" font-size="12" font-weight="400" fill="#777777" text-anchor="start">2 and 3</text><text x="345.84" y="270" font-size="12" font-weight="400" fill="#777777" text-anchor="start">MAC and IP</text><text x="565.28" y="270" font-size="12" font-weight="400" fill="#777777" text-anchor="start">Splits both, at hardware speed</text><line x1="28" y1="284" x2="872" y2="284" stroke="#e5e5e5" stroke-width="2"/><text x="42" y="308" font-size="12" font-weight="700" fill="#4b4b4b" text-anchor="start">Firewall</text><text x="193.92" y="308" font-size="12" font-weight="400" fill="#777777" text-anchor="start">3 - 7</text><text x="345.84" y="308" font-size="12" font-weight="400" fill="#777777" text-anchor="start">Policy</text><text x="565.28" y="308" font-size="12" font-weight="400" fill="#777777" text-anchor="start">Enforces a boundary</text><rect x="28" y="92" width="844" height="230" rx="12" fill="none" stroke="#e5e5e5" stroke-width="2"/><rect x="28" y="340" width="844" height="44" rx="12" fill="#f7f9fc" stroke="#e5e5e5" stroke-width="2"/><text x="450.0" y="367" font-size="12.5" font-weight="400" fill="#777777" text-anchor="middle">A switch does not stop a broadcast storm; only a router boundary does.</text></svg>