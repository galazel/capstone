<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 444" width="900" height="444" font-family="system-ui, -apple-system, 'Segoe UI', Nunito, 'Helvetica Neue', Arial, sans-serif" role="img" aria-label="STRIDE: six threats, six properties"><defs><marker id="tip" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#afafaf"/></marker></defs><rect width="900" height="444" fill="#ffffff"/><text x="28" y="40" font-size="19" font-weight="800" fill="#4b4b4b" text-anchor="start">STRIDE: six threats, six properties</text><text x="28" y="62" font-size="13" font-weight="400" fill="#777777" text-anchor="start">Each STRIDE letter is the negation of one security property.</text><rect x="28" y="92" width="844" height="268" rx="12" fill="#ffffff" stroke="#e5e5e5" stroke-width="2"/><rect x="28" y="92" width="844" height="40" rx="12" fill="#f7f9fc"/><rect x="28" y="120" width="844" height="12" fill="#f7f9fc"/><text x="42" y="117" font-size="12.5" font-weight="800" fill="#4b4b4b" text-anchor="start">Threat</text><text x="253.0" y="117" font-size="12.5" font-weight="800" fill="#4b4b4b" text-anchor="start">Violates</text><text x="413.36" y="117" font-size="12.5" font-weight="800" fill="#4b4b4b" text-anchor="start">Example</text><text x="649.6800000000001" y="117" font-size="12.5" font-weight="800" fill="#4b4b4b" text-anchor="start">Typical control</text><line x1="28" y1="132" x2="872" y2="132" stroke="#e5e5e5" stroke-width="2"/><text x="42" y="156" font-size="12" font-weight="700" fill="#4b4b4b" text-anchor="start">Spoofing</text><text x="253.0" y="156" font-size="12" font-weight="400" fill="#777777" text-anchor="start">Authentication</text><text x="413.36" y="156" font-size="12" font-weight="400" fill="#777777" text-anchor="start">Forged identity</text><text x="649.6800000000001" y="156" font-size="12" font-weight="400" fill="#777777" text-anchor="start">Strong auth, MFA</text><rect x="28" y="170" width="844" height="38" fill="#f7f9fc"/><line x1="28" y1="170" x2="872" y2="170" stroke="#e5e5e5" stroke-width="2"/><text x="42" y="194" font-size="12" font-weight="700" fill="#4b4b4b" text-anchor="start">Tampering</text><text x="253.0" y="194" font-size="12" font-weight="400" fill="#777777" text-anchor="start">Integrity</text><text x="413.36" y="194" font-size="12" font-weight="400" fill="#777777" text-anchor="start">Modified data in transit</text><text x="649.6800000000001" y="194" font-size="12" font-weight="400" fill="#777777" text-anchor="start">Signing, hashing</text><line x1="28" y1="208" x2="872" y2="208" stroke="#e5e5e5" stroke-width="2"/><text x="42" y="232" font-size="12" font-weight="700" fill="#4b4b4b" text-anchor="start">Repudiation</text><text x="253.0" y="232" font-size="12" font-weight="400" fill="#777777" text-anchor="start">Non-repudiation</text><text x="413.36" y="232" font-size="12" font-weight="400" fill="#777777" text-anchor="start">Denying an action</text><text x="649.6800000000001" y="232" font-size="12" font-weight="400" fill="#777777" text-anchor="start">Audit logs, signatures</text><rect x="28" y="246" width="844" height="38" fill="#f7f9fc"/><line x1="28" y1="246" x2="872" y2="246" stroke="#e5e5e5" stroke-width="2"/><text x="42" y="270" font-size="12" font-weight="700" fill="#4b4b4b" text-anchor="start">Information disclosure</text><text x="253.0" y="270" font-size="12" font-weight="400" fill="#777777" text-anchor="start">Confidentiality</text><text x="413.36" y="270" font-size="12" font-weight="400" fill="#777777" text-anchor="start">Leaked records</text><text x="649.6800000000001" y="270" font-size="12" font-weight="400" fill="#777777" text-anchor="start">Encryption, access control</text><line x1="28" y1="284" x2="872" y2="284" stroke="#e5e5e5" stroke-width="2"/><text x="42" y="308" font-size="12" font-weight="700" fill="#4b4b4b" text-anchor="start">Denial of service</text><text x="253.0" y="308" font-size="12" font-weight="400" fill="#777777" text-anchor="start">Availability</text><text x="413.36" y="308" font-size="12" font-weight="400" fill="#777777" text-anchor="start">Resource exhaustion</text><text x="649.6800000000001" y="308" font-size="12" font-weight="400" fill="#777777" text-anchor="start">Rate limiting, capacity</text><rect x="28" y="322" width="844" height="38" fill="#f7f9fc"/><line x1="28" y1="322" x2="872" y2="322" stroke="#e5e5e5" stroke-width="2"/><text x="42" y="346" font-size="12" font-weight="700" fill="#4b4b4b" text-anchor="start">Elevation of privilege</text><text x="253.0" y="346" font-size="12" font-weight="400" fill="#777777" text-anchor="start">Authorisation</text><text x="413.36" y="346" font-size="12" font-weight="400" fill="#777777" text-anchor="start">User becomes admin</text><text x="649.6800000000001" y="346" font-size="12" font-weight="400" fill="#777777" text-anchor="start">Least privilege</text><rect x="28" y="92" width="844" height="268" rx="12" fill="none" stroke="#e5e5e5" stroke-width="2"/><rect x="28" y="378" width="844" height="44" rx="12" fill="#f7f9fc" stroke="#e5e5e5" stroke-width="2"/><text x="450.0" y="405" font-size="12.5" font-weight="400" fill="#777777" text-anchor="middle">Working the list systematically is the point - it stops a review from only finding the threats you already expected.</text></svg>