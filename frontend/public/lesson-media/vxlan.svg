<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 262" width="900" height="262" font-family="system-ui, -apple-system, 'Segoe UI', Nunito, 'Helvetica Neue', Arial, sans-serif" role="img" aria-label="VXLAN: the original frame, wrapped for transport"><defs><marker id="tip" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#afafaf"/></marker></defs><rect width="900" height="262" fill="#ffffff"/><text x="28" y="40" font-size="19" font-weight="800" fill="#4b4b4b" text-anchor="start">VXLAN: the original frame, wrapped for transport</text><text x="28" y="62" font-size="13" font-weight="400" fill="#777777" text-anchor="start">A VTEP wraps a layer 2 frame in a layer 3 packet so it can cross a routed fabric.</text><rect x="28" y="100" width="253.2" height="74" rx="12" fill="#f7f9fc" stroke="#1b6ef3" stroke-width="2"/><rect x="28" y="100" width="253.2" height="26" rx="12" fill="#1b6ef3"/><rect x="28" y="114" width="253.2" height="12" fill="#1b6ef3"/><text x="154.6" y="118" font-size="12" font-weight="800" fill="#ffffff" text-anchor="middle">Outer IP/UDP</text><text x="154.6" y="155" font-size="13.5" font-weight="700" fill="#4b4b4b" text-anchor="middle">underlay routing</text><rect x="281.2" y="100" width="168.8" height="74" rx="12" fill="#f7f9fc" stroke="#ff9600" stroke-width="2"/><rect x="281.2" y="100" width="168.8" height="26" rx="12" fill="#ff9600"/><rect x="281.2" y="114" width="168.8" height="12" fill="#ff9600"/><text x="365.6" y="118" font-size="12" font-weight="800" fill="#ffffff" text-anchor="middle">VXLAN header</text><text x="365.6" y="155" font-size="13.5" font-weight="700" fill="#4b4b4b" text-anchor="middle">VNI - 24 bits</text><rect x="450.0" y="100" width="422.0" height="74" rx="12" fill="#f7f9fc" stroke="#00b8d4" stroke-width="2"/><rect x="450.0" y="100" width="422.0" height="26" rx="12" fill="#00b8d4"/><rect x="450.0" y="114" width="422.0" height="12" fill="#00b8d4"/><text x="661.0" y="118" font-size="12" font-weight="800" fill="#ffffff" text-anchor="middle">Original Ethernet frame</text><text x="661.0" y="155" font-size="13.5" font-weight="700" fill="#4b4b4b" text-anchor="middle">the tenant's own traffic</text><rect x="28" y="194" width="844" height="46" rx="12" fill="#ffffff" stroke="#e5e5e5" stroke-width="2"/><text x="450.0" y="222" font-size="12.5" font-weight="400" fill="#777777" text-anchor="middle">24 bits of VNI allows ~16 million segments, against 4,094 usable VLANs - which is why VXLAN exists.</text></svg>